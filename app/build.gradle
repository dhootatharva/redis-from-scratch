plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'redis.Server'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
    // Run tests in build/ so the store's dump.rdb never lands in the source tree
    def workDir = layout.buildDirectory.dir('test-work').get().asFile
    workingDir = workDir
    doFirst { workDir.mkdirs() }
}

// Create a fat JAR — includes all dependencies in one file
// This is what Docker will run
jar {
    manifest {
        attributes 'Main-Class': 'redis.Server'
    }
    // Include all runtime dependencies
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}